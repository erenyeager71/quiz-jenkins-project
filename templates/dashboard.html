<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="topbar">
        <span class="brand">Quiz App</span>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
    <div class="dashboard">
        <h1>Welcome to the Dashboard</h1>
        <div class="cards">
            <div class="card">
                <h3>Recent Quiz</h3>
                {% if last_score is not none %}
                <p>Score: {{ last_score }} / {{ total }}</p>
                {% else %}
                <p>No quiz taken yet.</p>
                {% endif %}
            </div>
            <div class="card">
                <h3>Upcoming Quiz</h3>
                <p>DevOps Fundamentals - Coming Soon</p>
            </div>
            <div class="card">
                <h3>Profile Settings</h3>
                <p>{{ email }}</p>
            </div>
        </div>
        <a href="{{ url_for('start') }}" class="start-btn">Start Quiz</a>
    </div>
</body>
</html>
